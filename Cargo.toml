[package]
name = "stellar-contract-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "Stellar CLI plugin: verify that a contract's WASM reproduces from the SEP-58 build metadata it records."
repository = "https://github.com/stellar-experimental/stellar-contract-verify-plugin"
publish = false

# The binary name is what the stellar CLI's plugin fallback looks up: running
# `stellar contract verify …` execs `stellar-contract-verify` from PATH.
[[bin]]
name = "stellar-contract-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
stellar-xdr = { version = "28.0.0", features = ["cli"] }
wasmparser = "0.258"
sha2 = "0.11"
hex = "0.4"
regex = "1.13"
url = "2.5"
walkdir = "2.5"
tempfile = "3.27"
tar = "0.4"
flate2 = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "blocking",
] }
shlex = "2.0"
thiserror = "2.0"
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
wasm-gen = "0.1.4"
